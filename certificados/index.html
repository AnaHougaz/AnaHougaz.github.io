<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ana Beatriz | Certificates</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        :root {
            --text-main: #1A1A1A;
            --text-light: #707070;
            --border-color: #E0E0E0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;

            color: var(--text-main);

            max-width: 900px;

            margin: 0 auto;

            padding: 50px 25px;

            line-height: 1.6;
        }

        h1 {
            font-size: 2.2rem;

            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-light);

            margin-bottom: 40px;
        }

        h2 {
            font-size: 1.2rem;

            margin-top: 35px;

            border-bottom: 1px solid var(--border-color);

            padding-bottom: 7px;
        }

        .certificate {
            padding: 15px 0;

            border-bottom: 1px solid var(--border-color);
        }

        .certificate-title {
            font-weight: 600;

            margin-bottom: 3px;
        }

        .certificate a {
            color: var(--text-light);

            text-decoration: none;

            font-size: 0.9rem;
        }

        .certificate a:hover {
            color: var(--text-main);
        }

        .back {
            display: inline-block;

            margin-bottom: 35px;

            color: var(--text-light);

            text-decoration: none;

            font-size: 0.9rem;
        }

        .back:hover {
            color: var(--text-main);
        }

    </style>

</head>


<body>

    <a href="../index.html" class="back">
        ← Back to portfolio
    </a>


    <h1>
        Certificates
    </h1>

    <p class="subtitle">
        Academic, research and professional certificates.
    </p>


    <!-- ==================================================
         CONFERÊNCIAS / EVENTOS
    =================================================== -->

    <h2>
        Conferences & Events
    </h2>


    <div class="certificate">

        <div class="certificate-title">
            SIBGRAPI 2026
        </div>

        <a href="sibgrapi.pdf"
           target="_blank">

            View certificate →

        </a>

    </div>


    <!-- ==================================================
         CURSOS
    =================================================== -->

    <h2>
        Courses & Training
    </h2>


    <div class="certificate">

        <div class="certificate-title">
            Aeronautics Course
        </div>

        <a href="aeronautica.pdf"
           target="_blank">

            View certificate →

        </a>

    </div>


    <!-- ==================================================
         OUTROS
    =================================================== -->

    <h2>
        Academic & Professional Activities
    </h2>


    <div class="certificate">

        <div class="certificate-title">
            Teaching assistantship / tutoring
        </div>

        <a href="monitoria.pdf"
           target="_blank">

            View certificate →

        </a>

    </div>

</body>

</html>
